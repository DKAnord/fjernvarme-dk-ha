name: Release Asset

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  attach-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package custom_components/kmd_easy_energy into kmd_easy_energy.zip
        run: git archive --format=zip -o kmd_easy_energy.zip HEAD:custom_components/kmd_easy_energy
      - name: Upload kmd_easy_energy.zip and kmd-easy-energy-card.js to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kmd_easy_energy.zip
            dist/kmd-easy-energy-card.js
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
