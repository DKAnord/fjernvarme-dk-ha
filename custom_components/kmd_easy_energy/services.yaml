update_token:
  name: Sync with a manual access token
  description: Advanced fallback. Runs one sync with a Bearer token you obtained yourself. The token is used for this sync only and is not stored.
  fields:
    access_token:
      name: Access token
      description: Bearer token (with or without "Bearer " prefix)
      required: true
      selector:
        text:
    customer_id:
      name: Customer ID
      description: Optional Customer-Id header value
      required: false
      selector:
        text:
    customer_number:
      name: Customer number
      description: Optional Customer-Number header value
      required: false
      selector:
        text:
    entry_id:
      name: Config entry ID
      description: Optional – defaults to the first entry
      required: false
      selector:
        text:

refresh:
  name: Reload cached data
  description: Re-read cached data and recompute derived values. Does not contact KMD; use start_mitid_sync (the Synkroniser button) to fetch new data.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional – refreshes all entries if omitted
      required: false
      selector:
        text:

configure_utility:
  name: Configure utility & setup
  description: Configure utility portal, location, thresholds, and optionally start MitID sync or complete initial setup.
  fields:
    utility_id:
      name: Utility ID
      required: false
      selector:
        text:
    portal_url:
      name: Portal URL
      required: false
      selector:
        text:
    location_name:
      name: Location name
      required: false
      selector:
        text:
    bonus_temp:
      name: Expected return / bonus temp (°C, 0 = auto)
      required: false
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
    penalty_temp:
      name: Return temp penalty (°C, 0 = same as expected / auto)
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
    price_dkk_per_kwh:
      name: Heat price incl. VAT (DKK/kWh, 0 = default)
      required: false
      selector:
        number:
          min: 0
          max: 20
          step: 0.001
    motivation_pct_per_k:
      name: Motivation tariff (% per °C, 0 = default)
      required: false
      selector:
        number:
          min: 0
          max: 25
          step: 0.1
    motivation_dkk_per_kwh_per_k:
      name: Motivation tariff (DKK/kWh/°C, 0 = default)
      required: false
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
    mitid_username:
      name: MitID User ID
      required: false
      selector:
        text:
    notify_service:
      name: Mobile notify service
      required: false
      selector:
        text:
    start_sync:
      name: Start MitID sync
      required: false
      selector:
        boolean:
    complete_setup:
      name: Complete initial setup
      required: false
      selector:
        boolean:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:

reset_setup:
  name: Reset initial setup
  description: Switch the dashboard back into Initial Setup Mode.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:

start_mitid_sync:
  name: Start MitID sync
  description: Start the built-in MitID login to refresh the access token.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional – defaults to the first entry
      required: false
      selector:
        text:
    utility_id:
      name: Utility ID
      description: Optional alternative to entry_id (e.g. kredslob)
      required: false
      selector:
        text:
    mitid_username:
      name: MitID User ID
      required: false
      selector:
        text:
    notify_service:
      name: Mobile notify service
      required: false
      selector:
        text:

sync:
  name: Sync now
  description: Fetch new data. KMD utilities - one MitID login (same as start_mitid_sync). E|Forsyning utilities - login with consumer number and web PIN. Watts On utilities - stored Watts On login (refresh token).
  fields:
    entry_id:
      name: Config entry ID
      description: Optional – defaults to the first entry
      required: false
      selector:
        text:
